<link rel="stylesheet" href="email-verification.css">
<script src="./tailwind.js"></script>
<!-- FAVICON SETUP -->
<link rel="icon" href="/favicon.ico" />

<!-- PNG favicons -->
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

<meta name="theme-color" content="#000000" />

<body class="bg-[#050608] min-h-screen flex items-center justify-center text-white p-4">

<div class="w-full max-w-md glass rounded-2xl p-6 fade">

<h1 class="text-2xl font-bold">Forgot Password</h1>
<p class="text-sm text-slate-400 mt-1 mb-6">
    Enter your email and we’ll send you a reset link.
</p>

<input 
    id="email"
    type="email"
    placeholder="you@example.com"
    class="w-full p-3 rounded-lg bg-white/5 border border-white/10 outline-none text-sm mb-4 focus:border-indigo-500"
/>

<button 
    id="sendBtn"
    class="w-full p-3 rounded-lg bg-indigo-600 hover:bg-indigo-500 font-semibold transition active:scale-95"
>
    Send Reset Link
</button>

<p id="status" class="text-xs text-slate-400 mt-4"></p>

</div>

<div id="alert-box" class="opacity-0 pointer-events-none transition-all">
    <div class="w-10 h-1 bg-white/30 rounded-full mx-auto mb-2"></div>
    <div id="alert-text"></div>
    <!-- progress bar -->
    <div class="w-full h-1 bg-white/20 mt-2 rounded-full overflow-hidden">
        <div id="alert-progress" class="h-full bg-white w-full"></div>
    </div>
</div>

<div class="mt-10 flex justify-center w-full max-w-md">
    <p class="text-[11px] text-slate-500 leading-relaxed text-center px-4">

        <span class="text-white font-semibold">© Gressor</span>
        <span id="brand-message" class="ml-1"></span>

    </p>
</div>

<script type="module" src="email-verification.js"></script>

</body>
</html>
