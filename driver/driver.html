<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Driver Login — Gmarketfy</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./tailwind.js"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- FAVICON SETUP -->
  <link rel="icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png" />
  <meta name="theme-color" content="#000000" />

  <style>
    /* ————— Base ————— */
    html, body { height: 100%; }
    body {
      background: #030406;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient background glows */
    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 400px; height: 400px;
      background: rgba(99, 102, 241, 0.18);
      top: -120px; left: -120px;
    }
    body::after {
      width: 350px; height: 350px;
      background: rgba(139, 92, 246, 0.12);
      bottom: -120px; right: -120px;
    }

    /* ————— Glass card ————— */
    .glass {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* ————— Inputs ————— */
    .auth-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 14px 16px 14px 44px;
      font-size: 15px;
      color: white;
      outline: none;
      transition: border-color 0.18s, background 0.18s;
    }
    .auth-input::placeholder { color: rgba(255, 255, 255, 0.25); }
    .auth-input:focus {
      border-color: rgba(99, 102, 241, 0.6);
      background: rgba(99, 102, 241, 0.04);
    }

    /* ————— Button ————— */
    .auth-btn {
      width: 100%;
      height: 52px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 14px;
      color: white;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      box-shadow: 0 10px 30px -8px rgba(99, 102, 241, 0.55);
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .auth-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 14px 34px -8px rgba(99, 102, 241, 0.65);
    }
    .auth-btn:active:not(:disabled) {
      transform: scale(0.985);
    }
    .auth-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* ————— Spinner ————— */
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.25);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }
    .spinner.hidden { display: none !important; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ————— Shake on error ————— */
    .shake {
      animation: shake 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }
    @keyframes shake {
      10%, 90% { transform: translateX(-2px); }
      20%, 80% { transform: translateX(4px); }
      30%, 50%, 70% { transform: translateX(-7px); }
      40%, 60% { transform: translateX(7px); }
    }

    /* ————— Success checkmark ————— */
    @keyframes draw-check {
      to { stroke-dashoffset: 0; }
    }
    .check-path {
      stroke-dasharray: 48;
      stroke-dashoffset: 48;
      animation: draw-check 0.55s ease-out 0.1s forwards;
    }

    /* Hide number input spinners */
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center px-4 py-8">

  <!-- Auth card -->
  <div id="auth-card" class="glass w-full max-w-sm rounded-3xl p-7 sm:p-8 relative z-10 shadow-2xl shadow-black/40">

    <!-- BRAND HEADER -->
    <div class="text-center mb-7">
      <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full glass mb-4">
        <div class="w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.8)]"></div>
        <span class="text-[10px] font-bold uppercase tracking-widest text-white/60">Driver Portal</span>
      </div>
      <h1 class="text-2xl font-extrabold bg-gradient-to-r from-indigo-400 via-violet-400 to-indigo-400 bg-clip-text text-transparent tracking-tight">
        Gmarketfy
      </h1>
      <p class="text-xs text-white/40 mt-1.5">Sign in to start delivering</p>
    </div>

    <!-- =====================================================
         STEP: checking
    ===================================================== -->
    <div id="step-checking" class="py-10">
      <div class="flex flex-col items-center justify-center">
        <div class="spinner" style="width:28px;height:28px;border-width:3px;"></div>
        <p class="text-xs text-white/40 mt-4">Checking your session…</p>
      </div>
    </div>

    <!-- =====================================================
         STEP: login
    ===================================================== -->
    <div id="step-login" class="hidden">
      <form id="login-form" class="space-y-4" novalidate>

        <!-- Phone -->
        <div class="relative">
          <i class="fas fa-phone absolute left-4 top-1/2 -translate-y-1/2 text-white/25 text-sm"></i>
          <input
            id="login-phone"
            type="tel"
            inputmode="numeric"
            autocomplete="tel"
            class="auth-input"
            placeholder="07XX XXX XXX"
            required
          />
        </div>

        <!-- PIN -->
        <div class="relative">
          <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-white/25 text-sm"></i>
          <input
            id="login-pin"
            type="password"
            inputmode="numeric"
            autocomplete="current-password"
            maxlength="6"
            class="auth-input tracking-[0.4em]"
            placeholder="6-digit PIN"
            required
          />
        </div>

        <!-- Error -->
        <p id="login-error" class="hidden text-xs text-red-400 bg-red-500/10 border border-red-500/15 rounded-xl px-3 py-2"></p>

        <!-- Submit -->
        <button id="login-submit-btn" type="submit" class="auth-btn mt-2">
          <span id="login-submit-text">Log In</span>
          <span id="login-spinner" class="spinner hidden"></span>
        </button>
      </form>

      <p class="text-[11px] text-center text-white/25 mt-5 leading-relaxed">
        Don't have an account? Contact your vendor to be onboarded as a driver.
      </p>
    </div>

    <!-- =====================================================
         STEP: reset (first login — forced PIN change)
    ===================================================== -->
    <div id="step-reset" class="hidden">
      <div class="mb-5 p-3 rounded-xl bg-indigo-500/10 border border-indigo-500/20">
        <p class="text-xs text-indigo-300 leading-relaxed">
          <i class="fas fa-shield-halved mr-1"></i>
          Welcome! Set your own 6-digit PIN to secure your account. You'll use it every time you log in.
        </p>
      </div>

      <form id="reset-form" class="space-y-4" novalidate>
        <!-- New PIN -->
        <div class="relative">
          <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-white/25 text-sm"></i>
          <input
            id="reset-pin"
            type="password"
            inputmode="numeric"
            maxlength="6"
            class="auth-input tracking-[0.4em]"
            placeholder="New 6-digit PIN"
            required
          />
        </div>

        <!-- Confirm -->
        <div class="relative">
          <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-white/25 text-sm"></i>
          <input
            id="reset-pin-confirm"
            type="password"
            inputmode="numeric"
            maxlength="6"
            class="auth-input tracking-[0.4em]"
            placeholder="Confirm PIN"
            required
          />
        </div>

        <p id="reset-error" class="hidden text-xs text-red-400 bg-red-500/10 border border-red-500/15 rounded-xl px-3 py-2"></p>

        <button id="reset-submit-btn" type="submit" class="auth-btn mt-2">
          <span id="reset-submit-text">Save PIN</span>
          <span id="reset-spinner" class="spinner hidden"></span>
        </button>
      </form>
    </div>

    <!-- =====================================================
         STEP: success
    ===================================================== -->
    <div id="step-success" class="hidden">
      <div class="flex flex-col items-center justify-center py-8">
        <div class="w-20 h-20 rounded-full bg-emerald-500/15 border border-emerald-500/25 flex items-center justify-center mb-5">
          <svg class="w-10 h-10 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path class="check-path" d="M5 13l4 4L19 7"/>
          </svg>
        </div>
        <p class="text-sm font-bold text-white">Welcome back!</p>
        <p class="text-xs text-white/40 mt-1">Loading your dashboard…</p>
      </div>
    </div>

  </div>

  <!-- =========================
       SCRIPTS
  ========================= -->
  <script type="module" src="./driver-auth.js"></script>

</body>
</html>
