<div class="max-w-md w-full p-8 rounded-2xl text-center shadow-xl 
            glass-card border border-slate-800/60">

  <!-- Icon -->

  <h1 class="text-2xl font-bold mb-2 text-white">
    Email Verified!
  </h1>

  <!-- Message -->
  <p class="text-slate-400 mb-6 leading-relaxed message">
   verifying...
  </p>

  <!-- Button -->
  <button id="redirection-btn" 
    class="bg-gradient-to-r from-sky-500 to-blue-600 
           hover:from-sky-400 hover:to-blue-500
           px-6 py-3 rounded-xl font-semibold 
           transition-all duration-300 shadow-lg shadow-blue-500/10">
    
    Go to Dashboard 🚀
  </button>

</div>



<script type="module">
import { getAuth } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, updateDoc  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

const firebaseConfig = { 
  apiKey: "AIzaSyAUErMIjiQgnprmqYd6wiscOa8CIAAELi8",
  authDomain: "marketfy-82c42.firebaseapp.com",
  projectId: "marketfy-82c42",
  storageBucket: "marketfy-82c42.firebasestorage.app",
  messagingSenderId: "321190245217",
  appId: "1:321190245217:web:b9eb39db0a9a2056a30b20",
  measurementId: "G-07W1D4H9JB"
}

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getFirestore(app);
let messageEl = document.querySelector(".message");
auth.onAuthStateChanged(async (user) => {
  if (!user) {return};

  await user.reload();

  if (user.emailVerified) {
    console.log("User verified ✅");
   
    messageEl.textContent = "Your email has been successfully verified. <br> your Vendor account is now verified.";
    try {
      // update Firestore vendor record
      const userRef = doc(db, "vendors", user.uid);

      await updateDoc(userRef, {
        emailVerified: true
      });

      console.log("Firestore updated: vendor verified 🎉");
    } catch (err) {
      console.error("Failed to update verification status:", err);
    }

  } else {
    messageEl.textContent = "Your email is not verified.";
    console.log("Still not verified ❌");
  }
});

document.getElementById("redirection-btn").addEventListener("click", ()=>{
  goToDashboard();
});

function goToDashboard() {
  window.location.href = "../dashboard.html";
}

</script>
